<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - SocialApp</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="logo">SocialApp</a>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="UsersDirectory.html">User Directory</a>
            <a href="friends.html">Friends</a>
            <a href="friend-requests.html">Requests <span id="requestBadge" class="badge">0</span></a>
            <a href="notifications.html">Notifications <span id="notificationBadge" class="badge">0</span></a>
            <a href="search.html">Search</a>
            <a href="create.html">Create</a>
            <a href="profile.html">Profile</a>
        </nav>

        <button class="logout-btn" onclick="logout()">Logout</button>
    </header>

    <main class="main-container">
        <div class="feed">
            <div class="auth-card">
                <h2>Buat Postingan</h2>
                <p class="subtitle">Bagikan foto dan caption.</p>

                <div class="form-group">
                    <label for="postImage">Foto</label>
                    <input type="file" id="postImage" accept="image/*" onchange="previewImage(this)">
                </div>

                <img id="imagePreview" class="image-preview" alt="Preview foto">

                <div class="form-group">
                    <label for="caption">Caption</label>
                    <textarea id="caption" rows="3" placeholder="Tulis caption..."></textarea>
                </div>

                <button class="btn-primary" onclick="sharePost()">Share</button>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
