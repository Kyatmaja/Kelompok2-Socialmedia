<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - SocialApp</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="logo">SocialApp</a>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="UsersDirectory.html">User Directory</a>
            <a href="friends.html">Friends</a>
            <a href="friend-requests.html">
                Requests
                <span id="requestBadge" class="badge">0</span>
            </a>
            <a href="notifications.html">
                Notifications
                <span id="notificationBadge" class="badge">0</span>
            </a>
            <a href="messages.html">
                Messages
                <span id="messageBadge" class="badge">0</span>
            </a>
            <a href="search.html" class="active">Search</a>
            <a href="create.html">Create</a>
            <a href="profile.html">Profile</a>

    <main class="main-container">
        <div class="page-header">
            <div>
                <h1>Search</h1>

        </div>

        <div class="search-box">
            <input

                id="userSearch" 
                placeholder="Search name or username..." 
                oninput="searchUsers()"
            >
        </div>

        <div class="user-grid" id="usersList"></div>
    </main>

    <script src="js/script.js"></script>
