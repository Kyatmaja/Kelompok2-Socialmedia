<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - SocialApp</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="logo">SocialApp</a>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="UsersDirectory.html">User Directory</a>
            <a href="friends.html">Friends</a>
            <a href="friend-requests.html">
                Requests
                <span id="requestBadge" class="badge">0</span>
            </a>
            <a href="notifications.html">
                Notifications
                <span id="notificationBadge" class="badge">0</span>
            </a>
            <a href="messages.html">
                Messages
                <span id="messageBadge" class="badge">0</span>
            </a>
            <a href="search.html" class="active">Search</a>
            <a href="create.html">Create</a>
            <a href="profile.html">Profile</a>
            <a href="help.html">Help</a>
            <a href="about.html">About</a>
        </nav>

        <button class="logout-btn" onclick="logout()">Logout</button>
        <a href="settings.html" title="Settings">⚙️</a>
    </header>

    <main class="main-container">
        <div class="page-header">
            <div>
                <h1>Search</h1>
                <p>Cari teman atau postingan di platform.</p>
            </div>
        </div>

        <!-- Filter & Input Pencarian -->
        <div class="search-box" style="display: flex; gap: 10px; align-items: center;">
            <input 
                type="text" 
                id="globalSearchInput" 
                placeholder="Ketik kata kunci pencarian..." 
                oninput="handleGlobalSearch()"
                style="flex: 1;"
            >
            <select id="searchFilter" onchange="handleGlobalSearch()" style="padding: 10px; border-radius: 8px;">
                <option value="all">Semua</option>
                <option value="users">Teman / User</option>
                <option value="posts">Postingan</option>
            </select>
        </div>

        <!-- Section Hasil Pencarian Pengguna -->
        <div id="usersResultSection">
            <h2>Hasil Teman / Pengguna</h2>
            <div class="user-grid" id="usersList"></div>
        </div>

        <br>

        <!-- Section Hasil Pencarian Postingan -->
        <div id="postsResultSection">
            <h2>Hasil Postingan</h2>
            <div id="postsList" class="chat-container"></div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
