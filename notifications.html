<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notifications - Social Media</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="logo">
            SocialApp
        </div>

        <nav>

            <a href="index.html">
                Dashboard
            </a>

            <a href="UsersDirectory.html">
                User Directory
            </a>

            <a href="friends.html">
                Friends
            </a>

            <a href="friend-requests.html">
                Requests
                <span id="requestBadge" class="badge">0</span>
            </a>

            <a href="notifications.html">
                Notifications
                <span id="notificationBadge" class="badge">0</span>
            </a>

            <a href="messages.html">
                Messages
            </a>

        </nav>


        <button
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </header>


    <!-- MAIN -->
    <main class="main-container">

        <div class="page-header">

            <div>

                <h1>
                    Notifications
                </h1>

                <p>
                    See your latest notifications
                </p>

            </div>


            <button
                class="clear-notification-btn"
                onclick="clearNotifications()"
            >

            </button>

        </div>


        <!-- NOTIFICATION LIST -->
        <div
            id="notificationsList"
            class="notification-list"
        >
        </div>

    </main>


    <script src="js/script.js"></script>
