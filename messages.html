<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Social Media</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">
            SocialApp
        </div>

        <nav>
            <a href="dashboard.html">dashboard</a>
            <a href="UsersDirectory.html">User Directory</a>
            <a href="friends.html">Friends</a>
            <a href="friend-requests.html">
                Requests
                <span id="requestBadge" class="badge">0</span>
            </a>
            <a href="notifications.html">
                Notifications
                <span id="notificationBadge" class="badge">0</span>
            </a>
            <a href="messages.html" class="active">Messages</a>
        </nav>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>
    </header>

    <main class="main-container">

        <div class="page-header">
            <div>
                <h1>Messages</h1>
                <p>Kirim dan terima pesan dari teman Anda.</p>
            </div>
        </div>

        <!-- Chat Container Bawaan CSS -->
        <div class="chat-container">
            <div class="chat-box" id="chatBox">
                <div class="message">
                    Halo! Selamat datang di fitur percakapan SocialApp.
                </div>
            </div>

            <div class="message-input">
                <div class="form-group" style="flex: 1; margin-bottom: 0;">
                    <input 
                        type="text" 
                        id="messageInput" 
                        placeholder="Ketik pesan Anda di sini..." 
                        onkeypress="if(event.key === 'Enter') sendMessage()"
                    >
                </div>
                <button class="btn-primary small-btn" onclick="sendMessage()">
                    Send
                </button>
            </div>
        </div>

    </main>

    <script src="js/script.js"></script>
</body>
</html>
