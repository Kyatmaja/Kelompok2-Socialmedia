<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - SocialApp</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="logo">SocialApp</a>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="UsersDirectory.html">User Directory</a>
            <a href="friends.html">Friends</a>
            <a href="friend-requests.html">
                Requests
                <span id="requestBadge" class="badge">0</span>
            </a>
            <a href="notifications.html">
                Notifications
                <span id="notificationBadge" class="badge">0</span>
            </a>
            <a href="messages.html">
                Messages
                <span id="messageBadge" class="badge">0</span>
            </a>
            <a href="search.html">Search</a>
            <a href="create.html">Create</a>
            <a href="profile.html">Profile</a>
            <a href="help.html">Help</a>
            <a href="about.html">About</a>
        </nav>

        <button class="logout-btn" onclick="logout()">Logout</button>
        <a href="settings.html" title="Settings">⚙️</a>
    </header>

    <main class="main-container">
        <div class="page-header">
            <div>
                <h1>Account Settings</h1>
                <p>Kelola profil dan pengaturan privasi akun Anda.</p>
            </div>
        </div>

        <div class="auth-card" style="max-width: 100%;">
            <h2>Edit Profil</h2>
            <p class="subtitle">Perbarui informasi diri Anda di bawah ini.</p>

            <form onsubmit="event.preventDefault(); saveSettings();">
                <div class="form-group">
                    <label for="displayName">Display Name</label>
                    <input 
                        type="text" 
                        id="displayName" 
                        placeholder="Masukkan nama tampilan Anda"
                    >
                </div>

                <div class="form-group">
                    <label for="bio">Bio</label>
                    <input 
                        type="text" 
                        id="bio" 
                        placeholder="Tuliskan bio singkat Anda"
                    >
                </div>

                <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
                    <input 
                        type="checkbox" 
                        id="privateMode" 
                        style="width: auto;"
                    >
                    <label for="privateMode" style="margin-bottom: 0;">Mode Akun Privat</label>
                </div>

                <button type="submit" class="btn-primary small-btn">
                    Save Changes
                </button>
            </form>
        </div>
    </main>

    <script src="js/script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const savedSettings = JSON.parse(localStorage.getItem("settings"));
            if (savedSettings) {
                if (savedSettings.displayName) document.getElementById("displayName").value = savedSettings.displayName;
                if (savedSettings.bio) document.getElementById("bio").value = savedSettings.bio;
                if (savedSettings.privateMode !== undefined) document.getElementById("privateMode").checked = savedSettings.privateMode;
            }
        });
    </script>
</body>
</html>
