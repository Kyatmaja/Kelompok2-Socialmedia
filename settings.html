<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Social Media</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">
            SocialApp
        </div>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="help.html">Help</a>
            <a href="about.html">About</a>

        </nav>
           
        <button class="logout-btn" onclick="logout()">
            Logout
        </button>
    </header>

    <main class="main-container">

        <div class="page-header">
            <div>
                <h1>Account Settings</h1>
                <p>Kelola profil dan pengaturan privasi akun Anda.</p>
            </div>
        </div>

        <div class="auth-card" style="max-width: 100%;">
            <h2>Edit Profil</h2>
            <p class="subtitle">Perbarui informasi diri Anda di bawah ini.</p>

            <form onsubmit="event.preventDefault(); saveSettings();">

                <div class="form-group">
                    <label for="displayName">Display Name</label>
                    <input 
                        type="text" 
                        id="displayName" 
                        placeholder="Masukkan nama tampilan Anda"
                    >
                </div>

                <div class="form-group">
                    <label for="bio">Bio</label>
                    <input 
                        type="text" 
                        id="bio" 
                        placeholder="Tuliskan bio singkat Anda"
                    >
                </div>

                <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
                    <input 
                        type="checkbox" 
                        id="privateMode" 
                        style="width: auto;"
                    >
                    <label for="privateMode" style="margin-bottom: 0;">Mode Akun Privat</label>
                </div>

                <button type="submit" class="btn-primary small-btn">
                    Save Changes
                </button>

            </form>
        </div>

    </main>

    <script src="js/script.js"></script>
    <script>
        // Mengisi form secara otomatis dari LocalStorage jika data settings sudah pernah disimpan
        document.addEventListener("DOMContentLoaded", function() {
            const savedSettings = JSON.parse(localStorage.getItem("settings"));
            if (savedSettings) {
                if (savedSettings.displayName) document.getElementById("displayName").value = savedSettings.displayName;
                if (savedSettings.bio) document.getElementById("bio").value = savedSettings.bio;
                if (savedSettings.privateMode !== undefined) document.getElementById("privateMode").checked = savedSettings.privateMode;
            }
        });
    </script>
</body>
</html>
